name: Enviar edição por e-mail

on:
  schedule:
    # Dias úteis, horário de Brasília = UTC-3. A segunda execução só envia se a primeira não tiver enviado.
    - cron: "52 11 * * 1-5"   # 08:52
    - cron: "32 12 * * 1-5"   # 09:32 (caso a análise do dia atrase)
  workflow_dispatch:
    inputs:
      test_to:
        description: "Teste: digite eu para mandar só para você. Deixe vazio para enviar aos destinatários normais."
        required: false
        default: ""
      force:
        description: "Enviar mesmo se a análise de hoje ainda não tiver sido publicada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          MAIL_TO_OVERRIDE: ${{ inputs.test_to }}
        run: |
          EXTRA=""
          # Na segunda tentativa (09:32), se a edição ainda não saiu, avisa o dono da conta.
          if [ "${{ github.event.schedule }}" = "32 12 * * 1-5" ]; then EXTRA="--alert-if-missing"; fi
          python scripts/send_email.py ${{ inputs.force && '--force' || '' }} $EXTRA

      - name: Registrar envio
        run: |
          git add site/data/email_sent.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git commit -m "E-mail da edição enviado"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

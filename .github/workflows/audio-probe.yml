name: Amostras de voz VoiceStudio (temporário)

on:
  push:
    branches: [claude/news-portal-ma-personalized-ejb59l]
    paths: [".github/workflows/audio-probe.yml"]

permissions:
  contents: write

# rodada 8: modelos do VoiceStudio que falam português (OmniVoice, VoxCPM2, Supertonic-3)
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        e: [supertonic, omnivoice, voxcpm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -q ffmpeg sox
      - name: Instalar
        run: |
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          case "${{ matrix.e }}" in
            supertonic) pip install -q supertonic==1.3.1 soundfile ;;
            omnivoice) pip install -q omnivoice==0.2.1 soundfile ;;
            voxcpm) pip install -q "voxcpm==2.0.3" soundfile ;;
          esac
          pip uninstall -y -q torchcodec || true
      - name: Gerar
        env: { E: "${{ matrix.e }}" }
        run: |
          mkdir -p out
          python - <<'PY'
          import json, os, sys, time, numpy as np, soundfile as sf
          sys.path.insert(0, "scripts")
          import brief_audio as b
          segs = b.script(json.load(open("site/data/digest.json")))[:3]
          texts = [s["speech"] for s in segs]
          e = os.environ["E"]
          gap = lambda sr: np.zeros(int(sr * 0.35), dtype=np.float32)
          def save(name, wavs, sr):
              sf.write(f"out/{name}.wav", np.concatenate([np.concatenate([np.asarray(w, dtype=np.float32).reshape(-1), gap(sr)]) for w in wavs]), sr)
              print("ok", name, flush=True)
          t0 = time.time()
          if e == "supertonic":
              from supertonic import TTS
              tts = TTS(model="supertonic-3")
              for v in ["F1", "F2", "F3", "F4", "F5"]:
                  st = tts.get_voice_style(voice_name=v)
                  save(f"Supertonic {v}", [tts.synthesize(text=t, voice_style=st, speed=0.95, lang="pt", total_steps=12)[0] for t in texts], tts.sample_rate)
          elif e == "omnivoice":
              import torch
              from omnivoice import OmniVoice
              m = OmniVoice.from_pretrained("k2-fsa/OmniVoice", device_map="cpu", dtype=torch.float32)
              for name, ins in [("OmniVoice jovem", "female, young adult, moderate pitch"), ("OmniVoice adulta", "female, middle-aged, low pitch")]:
                  out = [m.generate(text=t, language="Portuguese", instruct=ins, speed=0.95)[0].cpu().numpy() for t in texts]
                  save(name, out, m.sampling_rate or 24000)
          else:
              from voxcpm import VoxCPM
              m = VoxCPM.from_pretrained("openbmb/VoxCPM2", load_denoiser=False)
              sr = m.tts_model.sample_rate
              for name, d in [("VoxCPM2 locutora", "Mulher brasileira de 30 anos, voz quente e suave, locutora de podcast, fala calma e natural, português do Brasil"),
                              ("VoxCPM2 jornal", "Young Brazilian woman, warm and clear voice, news anchor, calm and natural pace, Brazilian Portuguese")]:
                  save(name, [m.generate(text=f"({d}){t}") for t in texts], sr)
          print(f"pronto em {time.time()-t0:.0f}s")
          PY
          for f in out/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 96k "${f%.wav}.mp3"; rm "$f"; done
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.e }}", path: out, if-no-files-found: ignore }

  juntar:
    needs: voz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: probe-audio, pattern: "out-*", merge-multiple: true }
      - run: |
          ls -la probe-audio || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached probe-audio 2>/dev/null || true
          git add -f probe-audio && git commit -m "Amostras de voz VoiceStudio" && git pull --rebase -q && git push

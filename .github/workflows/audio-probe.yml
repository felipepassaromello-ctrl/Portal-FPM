name: Amostras de voz (temporário)

on:
  push:
    branches: [claude/news-portal-ma-personalized-ejb59l]
    paths: [".github/workflows/audio-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar motores de voz
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q "kokoro>=0.9.4" soundfile "misaki[pt]" || pip install -q kokoro soundfile
      - name: Gerar amostras
        run: |
          rm -rf probe-audio && mkdir -p probe-audio
          python - <<'PY'
          import asyncio, json, sys, subprocess, os, traceback
          sys.path.insert(0, "scripts")
          import brief_audio as b
          d = json.load(open("site/data/digest.json"))
          txt = " ".join(s["speech"] for s in b.script(d)[:4])
          open("probe-audio/texto.txt", "w").write(txt)
          log = open("probe-audio/log.txt", "w")
          def mp3(wav, name):
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", wav, "-ac", "1", "-b:a", "64k", f"probe-audio/{name}.mp3"], check=True)
              os.remove(wav)
          # Kokoro: timbres femininos do modelo e misturas com a Dora, sempre com pronúncia em português (lang_code "p")
          try:
              from kokoro import KPipeline
              import soundfile as sf, numpy as np, torch
              pipe = KPipeline(lang_code="p")
              def voz(spec):
                  # "pf_dora:0.6+if_sara:0.4" vira a média ponderada dos vetores de estilo
                  parts = [(p.split(":")[0], float(p.split(":")[1]) if ":" in p else 1.0) for p in spec.split("+")]
                  tot = sum(w for _, w in parts)
                  return sum(pipe.load_single_voice(v) * (w / tot) for v, w in parts)
              testes = {
                  "Sara (italiana)": "if_sara", "Heart (americana)": "af_heart", "Bella (americana)": "af_bella",
                  "Nicole (americana, suave)": "af_nicole", "Emma (britanica)": "bf_emma", "Siwis (francesa)": "ff_siwis",
                  "Dora espanhola": "ef_dora",
                  "Dora + Sara": "pf_dora:0.55+if_sara:0.45", "Dora + Heart": "pf_dora:0.55+af_heart:0.45",
                  "Dora + Bella": "pf_dora:0.55+af_bella:0.45", "Dora + Nicole": "pf_dora:0.6+af_nicole:0.4",
                  "Sara + Heart": "if_sara:0.5+af_heart:0.5", "Dora + Sara + Heart": "pf_dora:0.4+if_sara:0.3+af_heart:0.3",
              }
              for nome, spec in testes.items():
                  try:
                      v = voz(spec)
                      audio = np.concatenate([a for _, _, a in pipe(txt, voice=v, speed=1.0)])
                      sf.write("/tmp/k.wav", audio, 24000); mp3("/tmp/k.wav", f"kokoro3 - {nome}"); print("ok", nome, file=log)
                  except Exception:
                      print("falhou", nome, file=log); traceback.print_exc(file=log)
          except Exception:
              traceback.print_exc(file=log)
          log.close()
          PY
          cat probe-audio/log.txt; ls -la probe-audio
      - name: Devolver as amostras ao branch
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add probe-audio
          git commit -m "Amostras de voz do briefing (rodada 3)"
          git pull --rebase -X theirs || true
          git push

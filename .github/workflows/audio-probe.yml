name: Amostras de voz VoxCPM2 (temporário)

on:
  push:
    branches: [claude/news-portal-ma-personalized-ejb59l]
    paths: [".github/workflows/audio-probe.yml"]

permissions:
  contents: write

# rodada 9: briefing inteiro com a "locutora" do VoxCPM2. A voz é desenhada uma vez (semente fixa) e depois clonada em
# todos os trechos, para não mudar de timbre no meio. Três sementes = três locutoras candidatas.
jobs:
  vox:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -q ffmpeg
      - run: |
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "voxcpm==2.0.3" soundfile
          pip uninstall -y -q torchcodec || true
      - name: Gerar
        env: { SEED: "${{ matrix.seed }}" }
        run: |
          mkdir -p out
          python - <<'PY'
          import json, os, sys, time, random, numpy as np, soundfile as sf, torch
          sys.path.insert(0, "scripts")
          import brief_audio as b
          from voxcpm import VoxCPM
          seed = int(os.environ["SEED"])
          segs = b.script(json.load(open("site/data/digest.json")))
          m = VoxCPM.from_pretrained("openbmb/VoxCPM2", load_denoiser=False)
          sr = m.tts_model.sample_rate
          D = "Mulher brasileira de 30 anos, voz quente e suave, locutora de podcast, fala calma e natural, português do Brasil"
          REF = "Bom dia. Hoje eu vou contar com calma o que aconteceu no mercado, quais empresas estão negociando e o que vale acompanhar ao longo do dia."
          t0 = time.time()
          random.seed(seed); np.random.seed(seed); torch.manual_seed(seed)
          ref = m.generate(text=f"({D}){REF}")
          sf.write("out/ref.wav", ref, sr)
          out = []
          for i, s in enumerate(segs):
              w = m.generate(text=s["speech"], prompt_wav_path="out/ref.wav", prompt_text=REF)
              out += [np.asarray(w, dtype=np.float32).reshape(-1), np.zeros(int(sr * 0.45), dtype=np.float32)]
              print(f"trecho {i + 1}/{len(segs)} em {time.time() - t0:.0f}s", flush=True)
          sf.write(f"out/full.wav", np.concatenate(out), sr)
          PY
          ffmpeg -loglevel error -y -i out/full.wav -b:a 96k "out/VoxCPM2 locutora ${{ matrix.seed }} - briefing.mp3"
          ffmpeg -loglevel error -y -i out/ref.wav -b:a 96k "out/VoxCPM2 locutora ${{ matrix.seed }} - voz.mp3"
          cp out/ref.wav "out/ref-${{ matrix.seed }}.wav"; rm out/full.wav out/ref.wav
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "out-${{ matrix.seed }}", path: out, if-no-files-found: ignore }

  juntar:
    needs: vox
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: probe-audio, pattern: "out-*", merge-multiple: true }
      - run: |
          ls -la probe-audio || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached probe-audio 2>/dev/null || true
          git add -f probe-audio && git commit -m "Amostras de voz VoxCPM2" && git pull --rebase -q && git push

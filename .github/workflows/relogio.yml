name: Relógio das coletas

# O agendador do GitHub (schedule) atrasa horas e pula a maior parte das coletas do dia: em 09/11, o portal ficou sem
# atualização das 08:52 às 16:08; em 12 e 13/11, três horas à tarde. Este workflow mantém o portal atualizado de hora em
# hora sem depender dele: espera até completar 55 minutos desde o início da última atualização, dispara a próxima e
# dispara a si mesmo para a volta seguinte.
#
# Por que ele dispara a si mesmo: o GitHub não gera o evento workflow_run quando a atualização foi disparada pelo
# próprio relógio (o token do workflow não cria eventos, a não ser workflow_dispatch). Em 16/11 o relógio parou depois
# de uma volta por isso. O workflow_run continua servindo para religar o relógio de manhã, depois da atualização que a
# rotina da manhã dispara, e depois de qualquer atualização do agendador ou de um push.
#
# A espera é um sleep dentro do job. Como o repositório é público, os minutos do GitHub Actions são gratuitos: a espera
# não custa nada. Uma espera nova cancela a anterior (concurrency), então nunca há mais de uma. Só dispara em dias
# úteis, das 06h às 20h30 de Brasília, e se nenhuma atualização tiver começado nos últimos 45 minutos; fora desse
# horário o relógio para e não dispara a si mesmo.
on:
  workflow_run:
    workflows: ["Atualizar portal"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: true

jobs:
  proxima:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Esperar, disparar a próxima atualização e a próxima volta do relógio
        run: |
          no_horario() {
            local hhmm dow
            hhmm=$(TZ=America/Sao_Paulo date +%H%M); dow=$(TZ=America/Sao_Paulo date +%u)
            [ "$dow" -le 5 ] && [ "$((10#$hhmm))" -ge 600 ] && [ "$((10#$hhmm))" -le 2030 ]
          }
          if ! no_horario; then
            echo "Fora do horário (dias úteis, das 06h às 20h30): o relógio para até a próxima atualização."
            exit 0
          fi
          started=$(gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=1" \
            --jq '.workflow_runs[0] | (.run_started_at // .created_at)')
          wait=$(( $(date -d "$started" +%s) + 55 * 60 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "Última atualização começou em $started; esperando $((wait / 60)) minutos."
            sleep "$wait"
          fi
          if ! no_horario; then
            echo "Fora do horário: o relógio para até a próxima atualização."
            exit 0
          fi
          since=$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.created_at > \"$since\")] | length")
          if [ "$recent" -gt 0 ]; then
            echo "Houve atualização nos últimos 45 minutos ($recent): não disparo outra agora."
          else
            gh workflow run update.yml --repo "$REPO" --ref main
            echo "Próxima atualização disparada."
            sleep 20
          fi
          gh workflow run relogio.yml --repo "$REPO" --ref main
          echo "Próxima volta do relógio disparada."

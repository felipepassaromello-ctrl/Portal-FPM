name: Sondar fontes (temporário)

on:
  push:
    branches: [claude/news-portal-ma-personalized-ejb59l]
    paths: [".github/workflows/probe.yml", "probe/probe.py", "scripts/perfis.py"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python probe/probe.py > probe/out.txt 2>&1 || true
      - run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add probe/out.txt probe/amostras
          git commit -m "Sonda: resultado" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

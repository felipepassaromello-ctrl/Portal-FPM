name: Atualizar portal

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3).
    - cron: "40 8 * * *"          # 05:40 — edição da manhã, pronta antes de você chegar
    - cron: "7 9-23 * * 1-5"      # dias úteis: de hora em hora, 06:07 às 20:07
    - cron: "1 11 * * *"          # 08:01 — fecha a edição do dia logo após as 08h (o das 08:07 costuma atrasar)
    - cron: "7 12,18,22 * * 0,6"  # fim de semana: 09:07, 15:07 e 19:07
  workflow_dispatch:
    inputs:
      refazer_perfis:
        description: Refazer os perfis das companhias agora (em vez de esperar a rodada diária)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "config/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # folga para a segunda tentativa de publicação (10 minutos no máximo cada)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Coletar e analisar notícias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          MAX_ANALYZE: ${{ vars.MAX_ANALYZE || '90' }}
        run: python scripts/build_digest.py

      # o próprio script para em 8 minutos ou quando a CVM não responde; o teto do passo é a última garantia
      - name: Baixar o texto dos documentos da CVM a resumir
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/cias.py textos

      # PDF sem texto de verdade (apresentação em imagem, fonte sem mapa de caracteres): OCR em português. O OCR só é
      # instalado quando há algum documento esperando, e este passo nunca derruba a execução.
      - name: Ler por OCR os PDFs da CVM sem texto
        continue-on-error: true
        timeout-minutes: 8
        run: |
          if python scripts/cias.py ocr --check; then
            timeout 150 sudo apt-get update -qq || true
            timeout 150 sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-por poppler-utils > /dev/null
            python scripts/cias.py ocr
          fi

      - name: Salvar edição no repositório (histórico)
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Edição $(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

      # A base de companhias não vai para o repositório: é refeita a cada publicação. O cache guarda a última
      # versão boa, para o caso de a CVM não responder.
      - uses: actions/cache@v4
        with:
          path: site/data/cias
          key: cias-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cias-

      - name: Perfis das companhias (FCA, FRE, DFP e ITR da CVM; refeitos uma vez por dia)
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/perfis.py base ${{ inputs.refazer_perfis && '--force' || '' }}

      - name: Cotações e ofertas públicas
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python scripts/perfis.py precos
          python scripts/perfis.py ofertas

      - name: Montar a base de companhias abertas
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/cias.py build

      - name: Ligar notícias, deals, leads e ofertas às companhias
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/perfis.py montar

      # O mapa de quem é dono de quem: o grafo sai dos perfis (Python) e as posições do ForceAtlas2 (Node). Sem mudança
      # na estrutura, as posições da rodada anterior são mantidas e o passo leva menos de um segundo.
      - name: Mundo das companhias (grafo e posições no mapa)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python scripts/mundo.py
          cd scripts && npm ci --no-audit --no-fund && node mundo_layout.mjs

      # O briefing narrado (voz neural): só é refeito quando o briefing muda. Não vai para o repositório; o cache guarda
      # o último áudio para as rodadas de hora em hora.
      - uses: actions/cache@v4
        with:
          path: site/audio
          key: audio-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: audio-

      - name: Áudio do briefing
        continue-on-error: true
        timeout-minutes: 8
        env:
          # sem o segredo, narra com a voz gratuita do edge-tts
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/brief_audio.py

      - name: Forçar o navegador a carregar o visual novo a cada publicação
        run: sed -i "s#styles.css\"#styles.css?v=${GITHUB_SHA::7}\"#; s#app.js\"#app.js?v=${GITHUB_SHA::7}\"#; s#cias.js\"#cias.js?v=${GITHUB_SHA::7}\"#; s#mundo.css\"#mundo.css?v=${GITHUB_SHA::7}\"#; s#mundo.js\"#mundo.js?v=${GITHUB_SHA::7}\"#; s#assistente.css\"#assistente.css?v=${GITHUB_SHA::7}\"#; s#assistente.js\"#assistente.js?v=${GITHUB_SHA::7}\"#" site/index.html site/cias.html site/mundo.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # O GitHub Pages às vezes deixa a publicação parada na fila até estourar os 10 minutos que o deploy-pages aceita
      # (foi o que derrubou a execução das 14h48 de 06/11). O deploy-pages cancela a publicação presa; aqui ela é
      # tentada de novo uma vez, para a edição não ficar fora do ar até a próxima execução.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de tentar publicar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # E-mail da manhã: sai logo depois da publicação que leva a análise do dia (o push da rotina), às 08:52, sem
  # depender do agendador do GitHub, que às vezes atrasa horas. Nas outras execuções termina na hora: o envio do dia já
  # foi feito, a análise de hoje ainda não saiu, ou já passou das 10:30.
  email:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: email
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
        run: python scripts/send_email.py --wait-until 08:52
      - name: Registrar envio
        run: |
          git add site/data/email_sent.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git commit -m "E-mail da edição enviado"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

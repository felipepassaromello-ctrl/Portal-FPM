<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Mundo das companhias · Portal FPM</title>
  <meta name="description" content="O mapa de quem é dono de quem nas companhias abertas brasileiras: controladores, acionistas, grupos econômicos, controladas e conselhos.">
  <meta name="theme-color" content="#05070d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mundo.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><text x='16' y='20.5' font-family='Helvetica,Arial' font-weight='700' font-size='10' fill='white' text-anchor='middle'>FPM</text></svg>">
  <script>
    // o Mundo é sempre escuro (um céu), independente do tema do resto do portal
    document.documentElement.dataset.theme = "dark";
  </script>
</head>
<body class="mundo loading">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2.5h12V16"/></symbol>
      <symbol id="i-path" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><path d="M7.5 17 16.5 7M14 18.5h4.5V14"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 5 18V8.5A1.5 1.5 0 0 1 6.5 7H10"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.5-8.5 4.5L3.5 8z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></symbol>
      <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
      <symbol id="i-cias" viewBox="0 0 24 24"><path d="M4.5 20V7.5l6-3V20M10.5 9.5l9 3V20M3 20h18M7 10h1M7 13h1M7 16h1M14 14.5h1M14 17.5h1"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M8 7.5l4-4 4 4M6 11v8.5h12V11"/></symbol>
    </defs>
  </svg>

  <div id="stage" class="m-stage">
    <canvas id="map" class="m-canvas" aria-label="Mapa interativo das companhias abertas e de quem é dono delas" role="img"></canvas>
    <canvas id="ovl" class="m-canvas m-ovl" aria-hidden="true"></canvas>

    <!-- barra de cima: voltar, título, busca, camadas -->
    <header class="m-top">
      <a class="m-glass m-back" href="index.html" title="Voltar ao portal" aria-label="Voltar ao portal"><svg class="ic"><use href="#i-back"/></svg><span class="logo logo-sm">FPM</span></a>
      <div class="m-glass m-title">
        <b>Mundo das companhias</b>
        <span id="m-sub" class="m-sub">carregando…</span>
      </div>
      <div class="m-search m-glass" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="m-results">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="m-q" type="search" placeholder="Empresa, pessoa, grupo ou investidor" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar no mapa" aria-controls="m-results">
        <kbd class="m-kbd">/</kbd>
        <ul id="m-results" class="m-results" role="listbox" hidden></ul>
      </div>
      <div class="m-actions">
        <button id="m-layers-btn" class="m-glass m-icon" type="button" title="Camadas" aria-label="Camadas" aria-expanded="false"><svg class="ic"><use href="#i-layers"/></svg></button>
      </div>
      <div id="m-layers" class="m-glass m-pop m-layers" hidden>
        <h3>Mostrar</h3>
        <label class="m-switch"><span><b>Pessoas físicas</b><small>acionistas e famílias</small></span><input type="checkbox" class="switch" data-layer="people" checked></label>
        <label class="m-switch"><span><b>Gestoras e fundos</b><small>investidores com 5% ou mais</small></span><input type="checkbox" class="switch" data-layer="funds" checked></label>
        <label class="m-switch"><span><b>Conselhos e diretorias</b><small>quem senta em mais de uma companhia</small></span><input type="checkbox" class="switch" data-layer="board"></label>
        <label class="m-switch"><span><b>Só controle</b><small>esconde participações sem controle</small></span><input type="checkbox" class="switch" data-layer="ctlonly"></label>
        <label class="m-switch"><span><b>Nomes dos grupos</b><small>rótulos dos grupos econômicos</small></span><input type="checkbox" class="switch" data-layer="groups" checked></label>
        <h3 class="m-pop-h">Setores <small>clique para ir até lá</small></h3>
        <div id="m-legend" class="m-legend"></div>
      </div>
    </header>

    <!-- explorar: grupos, investidores, conectores -->
    <aside id="m-explore" class="m-glass m-explore" aria-label="Explorar">
      <button class="m-explore-toggle" id="m-explore-toggle" type="button" aria-expanded="true"><svg class="ic"><use href="#i-compass"/></svg><span>Explorar</span><svg class="ic ic-sm m-chev"><use href="#i-chev"/></svg></button>
      <div class="m-explore-body">
        <div class="segmented m-tabs" role="tablist">
          <button type="button" role="tab" data-tab="groups" aria-checked="true">Grupos</button>
          <button type="button" role="tab" data-tab="investors" aria-checked="false">Investidores</button>
          <button type="button" role="tab" data-tab="connectors" aria-checked="false">Conectores</button>
        </div>
        <p id="m-tab-note" class="m-note"></p>
        <ol id="m-rank" class="m-rank"></ol>
      </div>
    </aside>

    <!-- painel da entidade selecionada -->
    <aside id="m-panel" class="m-glass m-panel" aria-label="Detalhes" hidden>
      <button class="m-grab" type="button" aria-label="Expandir ou recolher"></button>
      <button id="m-panel-close" class="m-icon m-close" type="button" aria-label="Fechar"><svg class="ic"><use href="#i-close"/></svg></button>
      <div id="m-panel-body" class="m-panel-body"></div>
    </aside>

    <!-- modo estrutura / caminho: faixa de contexto -->
    <div id="m-mode" class="m-glass m-mode" hidden>
      <span id="m-mode-text"></span>
      <button id="m-mode-close" class="m-icon" type="button" aria-label="Voltar ao mundo"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>

    <!-- onde você está, minimapa e zoom -->
    <div id="m-hud" class="m-hud" aria-live="off"></div>
    <div class="m-nav">
      <div class="m-zoom m-glass">
        <button id="m-zin" class="m-icon" type="button" aria-label="Aproximar" title="Aproximar (+)"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="m-zout" class="m-icon" type="button" aria-label="Afastar" title="Afastar (−)"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="m-zfit" class="m-icon" type="button" aria-label="Ver tudo" title="Ver tudo (0)"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
      <div class="m-mini-wrap m-glass"><canvas id="m-mini" class="m-mini" aria-label="Minimapa: clique para ir a um ponto do mapa" role="img"></canvas></div>
    </div>

    <div id="m-tip" class="m-tip" hidden></div>
    <div id="m-hint" class="m-glass m-hint" hidden><span class="desk-only">Arraste para navegar · role para aproximar · clique numa empresa para ver quem é dono · dois cliques abrem a estrutura</span><span class="touch-only">Arraste, pince para aproximar e toque numa empresa</span></div>
    <div id="m-empty" class="m-empty" hidden></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="mundo.js"></script>
</body>
</html>
